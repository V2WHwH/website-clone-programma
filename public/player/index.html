<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>HereWeHolo Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }

  /* Stage vult het scherm; bij rotation 90/270 worden breedte/hoogte gewisseld via JS. */
  #stage { position: absolute; inset: 0; background: #000; transform-origin: center center; }

  .layer {
    position: absolute; inset: 0;
    opacity: 0; transition: opacity var(--transition, 600ms) ease;
    background: #000;
  }
  .layer.visible { opacity: 1; }
  .layer video, .layer img, .layer iframe {
    width: 100%; height: 100%; border: 0; display: block; background: #000;
  }
  .fit-cover video, .fit-cover img { object-fit: cover; }
  .fit-contain video, .fit-contain img { object-fit: contain; }

  #message {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1rem; text-align: center;
    color: #9aa4b5; font: 400 clamp(16px, 2vmin, 28px)/1.5 system-ui, sans-serif;
    background: #000; z-index: 50; padding: 4vmin;
  }
  #message.hidden { display: none; }
  #message .logo { font-size: clamp(24px, 4vmin, 56px); font-weight: 700; color: #e8ecf4; letter-spacing: 0.04em; }
  #message .logo span { color: #35d0ba; }

  /* "Identify"-overlay vanuit het CMS */
  #identify {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(3, 10, 20, 0.92); color: #fff; z-index: 60;
    font: 700 clamp(28px, 6vmin, 90px)/1.3 system-ui, sans-serif; text-align: center;
  }
  #identify.show { display: flex; }

  #black { position: absolute; inset: 0; background: #000; z-index: 70; display: none; }
  #black.show { display: block; }
</style>
</head>
<body>
  <div id="stage">
    <div class="layer" id="layerA"></div>
    <div class="layer" id="layerB"></div>
  </div>
  <div id="message">
    <div class="logo">HereWe<span>Holo</span></div>
    <div id="messageText">Player wordt gestart…</div>
  </div>
  <div id="identify"></div>
  <div id="black"></div>
  <script src="/vendor/hls.min.js"></script>
  <script src="/player/player.js"></script>
</body>
</html>
