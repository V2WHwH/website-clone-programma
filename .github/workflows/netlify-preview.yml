name: netlify-preview

# Bouwt de volledige site en publiceert hem naar de Netlify-preview
# vision2watch-rebuild-preview.netlify.app.
#
# Draait in een GitHub-runner, omdat de ontwikkelomgeving waarin deze site
# is gebouwd zelf geen verbinding met Netlify mag maken.
#
# EENMALIG INSTELLEN (daarna gaat alles vanzelf):
#   1. Netlify > User settings > Applications > Personal access tokens:
#      maak een token aan.
#   2. GitHub > deze repository > Settings > Secrets and variables >
#      Actions > New repository secret:
#      naam NETLIFY_AUTH_TOKEN, waarde het token uit stap 1.
#
# Zonder dat token bouwt en controleert deze workflow de site nog steeds,
# maar slaat hij het publiceren over. Hij faalt dan niet: zo blijft
# zichtbaar dat de rest van de pijplijn klopt.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/vision2watch-rebuild-uf0biw]

concurrency:
  group: netlify-preview
  cancel-in-progress: true

permissions:
  contents: read

env:
  NETLIFY_SITE_ID: 52c62018-ab1b-4c45-826a-412cbbc5753b
  PREVIEW_URL: https://vision2watch-rebuild-preview.netlify.app

jobs:
  publiceren:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # De secrets-context mag niet in een if-voorwaarde staan, wel hier.
    # Zo weten de stappen hieronder of er een token is zonder het te tonen.
    env:
      HEEFT_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Typecontrole
        run: npm run typecheck

      - name: Bouwen
        run: npm run build

      - name: Kwaliteitscontrole
        run: npm run qa

      - name: Statische audit
        run: npm run audit:statisch

      - name: Preview op noindex zetten
        # Het script kijkt naar het doeladres: op vision2watch.nl doet het
        # niets, op een preview-adres zet het noindex aan.
        run: node scripts/preview-klaarzetten.mjs
        env:
          URL: ${{ env.PREVIEW_URL }}

      - name: Naar Netlify publiceren
        if: env.HEEFT_TOKEN == 'true'
        run: |
          npx --yes netlify-cli@27 deploy \
            --dir=dist --prod --site "$NETLIFY_SITE_ID" \
            --message "preview vanaf ${GITHUB_SHA::7}"
          echo "### Preview bijgewerkt" >> "$GITHUB_STEP_SUMMARY"
          echo "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Uitleg als het token nog ontbreekt
        if: env.HEEFT_TOKEN != 'true'
        run: |
          {
            echo "### Site gebouwd en gecontroleerd, publiceren overgeslagen"
            echo ""
            echo "Er staat nog geen secret \`NETLIFY_AUTH_TOKEN\` in deze repository."
            echo "Zodra dat er is, publiceert deze workflow vanzelf naar:"
            echo ""
            echo "$PREVIEW_URL"
            echo ""
            echo "Instellen: Netlify > User settings > Applications > Personal access tokens,"
            echo "daarna hier onder Settings > Secrets and variables > Actions."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Publiceren overgeslagen: NETLIFY_AUTH_TOKEN ontbreekt nog."
