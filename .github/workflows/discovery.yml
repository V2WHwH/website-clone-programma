name: discovery
on:
  workflow_dispatch: {}
  push:
    branches: [claude/vision2watch-rebuild-uf0biw]
    paths: ["discovery/trigger.txt"]

concurrency:
  group: discovery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/vision2watch-rebuild-uf0biw
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Media ophalen
        run: node discovery/media-ophalen.mjs
      - name: Resultaten committen
        run: |
          git config user.name "discovery-runner"
          git config user.email "actions@github.com"
          git add discovery/media-bron
          git commit -m "Discovery: bronmedia van huidige site opgehaald" || echo "niets te committen"
          git pull --rebase origin claude/vision2watch-rebuild-uf0biw
          git push origin claude/vision2watch-rebuild-uf0biw
