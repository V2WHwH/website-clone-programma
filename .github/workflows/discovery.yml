name: discovery
on:
  workflow_dispatch: {}

concurrency:
  group: discovery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/vision2watch-rebuild-uf0biw
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Crawl huidige site
        run: node discovery/crawl.mjs
      - name: Playwright installeren
        run: |
          npm init -y >/dev/null
          npm i playwright@1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Screenshots maken
        run: node discovery/screenshots.mjs
      - name: Resultaten committen
        run: |
          rm -rf node_modules package.json package-lock.json
          git config user.name "discovery-runner"
          git config user.email "actions@github.com"
          git add discovery
          git commit -m "Discovery: crawl huidige site + referentie-screenshots" || echo "niets te committen"
          git push origin claude/vision2watch-rebuild-uf0biw
