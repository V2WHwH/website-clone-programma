name: Windows desktop build

on:
  push:
    branches: [claude/holobox-4k-platform-ggpzo2]
    paths: ['desktop/**', 'studio/**', '.github/workflows/desktop-build.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Maak een release met deze tag (bijv. v1.0.0); leeg = alleen bouwen'
        required: false
        default: ''

permissions:
  contents: write   # nodig om releases (met tag) aan te maken

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencies installeren
        run: npm install

      - name: Syntaxcontrole
        run: npm run check

      - name: Windows release bouwen (installer + portable)
        run: npm run dist
        env:
          # Code signing activeert automatisch zodra de secrets CSC_LINK
          # (base64 van het .pfx-certificaat) en CSC_KEY_PASSWORD bestaan;
          # zonder certificaat bouwt hij unsigned zoals voorheen.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke-test op Windows (start, hardwaredetectie, afsluiten)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release\win-unpacked -Filter '*.exe' | Select-Object -First 1
          & $exe.FullName --smoke-test --no-sandbox --disable-gpu | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "Smoke-test faalde met exitcode $LASTEXITCODE" }
          if (-not (Test-Path smoke-result.json)) { throw 'smoke-result.json ontbreekt' }
          Get-Content smoke-result.json

      - name: Complete applicatie bundelen (broncode + installer in één zip)
        shell: pwsh
        run: |
          $ver   = (Get-Content package.json | ConvertFrom-Json).version
          $repo  = (Resolve-Path ..).Path
          $stage = "release\bundle\hereweholo-$ver"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # het hele project, zonder afhankelijkheden, geschiedenis en buildmap
          robocopy $repo $stage /E /NFL /NDL /NJH /NJS /XD node_modules .git release bundle
          if ($LASTEXITCODE -ge 8) { throw "Kopieren mislukt (robocopy $LASTEXITCODE)" }
          $global:LASTEXITCODE = 0
          # schone startdatabase: geen device-sleutels in een gedeelde download
          $dbPath = Join-Path $stage 'data\db.json'
          if (Test-Path $dbPath) {
            $db = Get-Content $dbPath -Raw | ConvertFrom-Json
            $db.devices = @(); $db.playlists = @(); $db.liveSources = @()
            $db | ConvertTo-Json -Depth 16 | Set-Content (Join-Path $stage 'data\db.example.json') -Encoding utf8
            Remove-Item $dbPath
          }
          # de zojuist gebouwde installer erbij, met controlegetal en uitleg
          $win = Join-Path $stage 'windows-app'
          New-Item -ItemType Directory -Force -Path $win | Out-Null
          $exe = Get-ChildItem release -Filter 'HereWeHolo-Player-Setup-*.exe' | Select-Object -First 1
          Copy-Item $exe.FullName $win
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          @(
            'De Windows-app — HereWeHolo Player ' + $ver
            ''
            '  ' + $exe.Name + '   dubbelklikken om te installeren'
            ''
            'Kioskmodus, GPU-versnelling, logging, diagnostiek (Ctrl+Shift+D),'
            'zelfonderhoud en crash-herstel. Dit is wat je op de holobox zet.'
            ''
            'Waarom niet gewoon studio/index.html in de browser? De app start'
            'schermvullend op, herstelt zichzelf na een vastloper, en speelt'
            'geluid meteen af — browsers dempen tot iemand het scherm aanraakt.'
            ''
            'WINDOWS WAARSCHUWT'
            'Zonder code-signing-certificaat meldt Defender een onbekende'
            'uitgever. Kies "Meer informatie" > "Toch uitvoeren".'
            ''
            'Controleren:'
            '  Get-FileHash .\' + $exe.Name + ' -Algorithm SHA256'
            'Verwacht:'
            '  ' + $hash
          ) | Set-Content (Join-Path $win 'LEES-MIJ.txt') -Encoding utf8
          Compress-Archive -Path $stage -DestinationPath "release\HereWeHolo-Compleet-$ver.zip" -Force
          Remove-Item -Recurse -Force release\bundle
          Write-Host ("Gebundeld: HereWeHolo-Compleet-$ver.zip ({0:N0} MB)" -f ((Get-Item "release\HereWeHolo-Compleet-$ver.zip").Length / 1MB))

      - name: Exe-loze Studio-versie bundelen (geen virusmeldingen)
        shell: pwsh
        run: |
          $out = "release\HereWeHolo-Studio-Offline-$((Get-Content package.json | ConvertFrom-Json).version).zip"
          Compress-Archive -Path ..\studio\index.html, "..\studio\Start Holobox.bat", "..\studio\Start Holobox (venster).bat", "..\studio\LEES MIJ.txt" -DestinationPath $out -Force
          Write-Host "Gebundeld: $out"

      - name: Checksums genereren
        shell: pwsh
        run: |
          $files = Get-ChildItem release | Where-Object { $_.Name -match '\.(exe|zip)$' }
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name }
          $lines | Set-Content release\SHA256SUMS.txt
          Get-Content release\SHA256SUMS.txt

      - name: Artefacten uploaden
        uses: actions/upload-artifact@v4
        with:
          name: hereweholo-player-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: GitHub Release maken (bij version-tag of handmatige release-trigger)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_version || github.ref_name }}
        run: |
          $notes = @(
            'WINDOWS-APPLICATIE (aanbevolen)'
            ''
            'HereWeHolo-Compleet-*.zip       ALLES IN EEN: de installer plus de'
            '                                complete applicatie, handleiding en'
            '                                broncode. Begin hier.'
            ''
            'HereWeHolo-Player-Setup-*.exe   alleen de installer'
            'HereWeHolo-Player-*-x64.zip     portable, uitpakken en starten'
            ''
            'Volwaardige desktop-app: kioskmodus, GPU-versnelling, logging,'
            'diagnostiek (Ctrl+Shift+D) en crash-herstel.'
            ''
            'Windows Defender / SmartScreen kan waarschuwen voor een onbekende'
            'uitgever zolang er geen code-signing-certificaat is. Kies dan'
            '"Meer informatie" > "Toch uitvoeren". De build komt rechtstreeks uit'
            'de broncode in deze repository; controleer desgewenst SHA256SUMS.txt.'
            ''
            'ZONDER INSTALLATIE'
            ''
            'HereWeHolo-Studio-Offline-*.zip  geen .exe, start via Chrome/Edge'
          )
          $notes | Set-Content -Path release\RELEASE-NOTES.txt -Encoding utf8
          $files = @()
          $files += (Get-ChildItem release\*.exe).FullName
          $files += (Get-ChildItem release\*.zip).FullName
          $files += (Resolve-Path release\SHA256SUMS.txt).Path
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # Tag bestaat al: bestanden vervangen in plaats van de stap laten falen.
            $global:LASTEXITCODE = 0
            gh release upload $env:RELEASE_TAG $files --clobber
          } else {
            $global:LASTEXITCODE = 0
            gh release create $env:RELEASE_TAG `
              --target $env:GITHUB_SHA `
              $files `
              --title "HereWeHolo Player $env:RELEASE_TAG" `
              --notes-file release\RELEASE-NOTES.txt
          }
