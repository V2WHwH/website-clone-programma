name: statuscheck
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL's, gescheiden door spaties"
        required: true

jobs:
  kijken:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Statuscodes ophalen
        run: |
          for u in ${{ github.event.inputs.urls }}; do
            code=$(curl -sS -o /tmp/pagina -w '%{http_code}' -L -A 'Mozilla/5.0 (compatible; statuscheck)' "$u" || echo "000")
            woorden=$(sed -e 's/<[^>]*>/ /g' /tmp/pagina 2>/dev/null | wc -w || echo 0)
            titel=$(grep -o '<title>[^<]*</title>' /tmp/pagina 2>/dev/null | head -1)
            echo "STATUS $code | WOORDEN $woorden | $u | $titel"
          done
