# Netlify-configuratie. De site is statisch: er valt op de server niets te
# bouwen wat hier niet al gebouwd is, dus wordt dist/ rechtstreeks
# gepubliceerd. Omleidingen en kopregels staan in dist/_redirects en
# dist/_headers; die pakt Netlify automatisch op.

[build]
  # De tweede stap zet een noindex-kop op elke pagina zolang de site niet op
  # het echte domein draait, zodat een preview niet naast vision2watch.nl in
  # Google verschijnt. Op vision2watch.nl doet die stap zelf niets; zie
  # scripts/preview-klaarzetten.mjs.
  command = "npm run build && node scripts/preview-klaarzetten.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Playwright is alleen nodig voor de audits, niet voor de build zelf.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
