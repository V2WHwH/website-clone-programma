# M2 deployment — single EU region (ADR-005): app + PostgreSQL + LiveKit SFU + coturn + Caddy (TLS).
# Copy .env.example to .env and fill in real secrets before `docker compose up -d`.
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8800"
      DATABASE_URL: postgres://holo:${POSTGRES_PASSWORD}@db:5432/holo
      JWT_SECRET: ${JWT_SECRET}
      LIVEKIT_URL: wss://${LIVEKIT_DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: holo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: holo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holo"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.9
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    network_mode: host # RTC needs the real host ports (UDP 50000-60000, TCP 7881)

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command: >-
      --no-cli --fingerprint --lt-cred-mech
      --user ${TURN_USER}:${TURN_PASSWORD}
      --realm ${TURN_DOMAIN}
      --listening-port 3478 --tls-listening-port 5349
      --cert /certs/fullchain.pem --pkey /certs/privkey.pem
      --min-port 49152 --max-port 49999
    volumes:
      - caddy_certs:/certs:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_certs:/certs

volumes:
  pgdata:
  caddy_data:
  caddy_certs:
