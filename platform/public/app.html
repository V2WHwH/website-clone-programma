<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HoloMe — Select destination</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="wm"><b>HOLO</b>ME</div>
      <div class="spacer"></div>
      <span class="who" id="who"></span>
      <button class="ghost small" id="logout">Sign out</button>
    </div>

    <h1>Select destination <small>choose one or more displays before the camera opens</small></h1>
    <div class="grid" id="devices"></div>
    <div class="msg" id="msg"></div>

    <div class="card">
      <h1 style="font-size:16px">Pair a new display</h1>
      <div class="sub">Open <code id="rcvUrl"></code> on the Holobox PC — it shows a code. Enter it here.</div>
      <div class="row2">
        <div class="field"><label>Pairing code</label><input id="pairCode" placeholder="H7K4M2" /></div>
        <div class="field"><label>Device name</label><input id="pairName" placeholder="Amsterdam HQ" /></div>
        <div class="field"><label>Kind</label>
          <select id="pairKind"><option value="holobox">Holobox</option><option value="holomini">Holomini</option><option value="holowall">Holowall</option></select>
        </div>
      </div>
      <button class="small" id="pairClaim" style="align-self:flex-start">Pair device</button>
      <div class="msg" id="pairMsg"></div>
    </div>

    <div class="card">
      <h1 style="font-size:16px">Invite a guest</h1>
      <div class="sub">Guests present from the browser — nothing to install. The link targets the selected destinations.</div>
      <div class="row2">
        <div class="field"><label>Valid for (hours)</label><input id="invTtl" type="number" value="24" min="1" max="168" /></div>
        <div class="field"><label>Uses</label>
          <select id="invUses"><option value="1">Single use</option><option value="">Reusable</option></select>
        </div>
        <div class="field"><label>Password (optional)</label><input id="invPw" type="text" /></div>
      </div>
      <button class="small" id="invCreate" style="align-self:flex-start">Create link</button>
      <div class="msg ok mono" id="invOut" style="user-select:all"></div>
    </div>

    <div class="bar">
      <span class="count"><b id="selCount">0</b> destinations selected</span>
      <button id="continue" disabled>Continue →</button>
    </div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
