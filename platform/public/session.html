<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HoloMe — Session</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="session">
  <div class="stage"><video id="self" class="self" autoplay muted playsinline></video></div>

  <div class="hud-top">
    <span class="live-badge glass"><i></i>LIVE</span>
    <span class="dest-chip glass" id="dest">→ …</span>
    <span class="pill glass" id="conn">preparing…</span>
    <span class="frozen-note glass" style="border-radius:999px;padding:6px 12px;">settings locked while live</span>
  </div>

  <div class="strip glass" id="strip">00:00:00 · STANDBY · 0 × 0 · 0.0 fps · 0.0 Mbps</div>

  <div class="pip"><video id="return" autoplay playsinline></video><span class="tag" id="pipTag">return feed</span></div>

  <!-- M6: network pre-flight — an honest, measured verdict before GO LIVE -->
  <div class="glass" id="preflight" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:8;padding:12px 18px;border-radius:12px;font:12px/1.7 'IBM Plex Mono',monospace;white-space:pre;color:var(--tx-2,#9fb2c5);">
    <div id="pfLines">pre-flight…</div>
  </div>

  <!-- M6: diagnostic view — the full resolution chain, measured stage by stage -->
  <div id="diag" style="display:none;position:fixed;left:16px;top:72px;z-index:9;padding:14px 16px;border-radius:10px;background:rgba(6,10,15,.88);border:1px solid rgba(53,224,255,.25);color:#9fb2c5;font:12px/1.7 'IBM Plex Mono',monospace;white-space:pre;"></div>

  <div class="hud-bottom">
    <button class="ghost small" id="exit">Exit</button>
    <button class="golive" id="golive" disabled>GO LIVE</button>
    <button class="ghost small" id="pip">Return feed</button>
    <button class="ghost small" id="diagBtn">Diagnostics</button>
  </div>
  <script type="module" src="/js/session.js"></script>
</body>
</html>
